<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>STAFFORA BOT</title>
<style>
html,body{margin:0;background:#07070a;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:linear-gradient(145deg,#a78bfa,#6d28d9);display:grid;place-items:center;font-size:28px}
.sub{color:#8b8b9a;font-size:14px;margin:8px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:12px;font-weight:600;text-decoration:none;margin:6px 0;min-width:240px;border:0;cursor:pointer;font-size:14px}
.btn-p{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.35)}
.btn-g{background:#16161a;color:#f4f4f5;border:1px solid #2a2a30}
.err{color:#f87171;margin-top:12px;font-size:13px}
</style></head>
<body>
<div id="boot"><div>
<div class="logo">🤖</div>
<div style="font-weight:700;font-size:20px">STAFFORA BOT</div>
<div class="sub" id="st">Premium Moderation · Discord + Roblox</div>
<div id="ui">
  <a class="btn btn-p" id="btn-login" href="https://staffora.apps.bot-hosting.cloud/auth/login?return=https%3A%2F%2Fstaffora.apps.bot-hosting.cloud%2Fdashboard">Mit Discord anmelden</a><br/>
  <a class="btn btn-g" href="./ingame.html">Ingame Panel</a><br/>
  <a class="btn btn-g" href="./unban.html">Unban Request</a>
  <div class="err" id="e"></div>
</div>
</div></div>
<script>
(function(){
  var API='https://staffora.apps.bot-hosting.cloud';
  var DASH=API+'/dashboard';
  function tokenFromUrl(){
    var t='';
    try{var m=location.search.match(/[?&]token=([^&#]+)/);if(m)t=decodeURIComponent(m[1]);}catch(e){}
    if(!t){try{var h=(location.hash||'').replace(/^#/,'');var m2=h.match(/(?:^|[&#])token=([^&#]+)/);if(m2)t=decodeURIComponent(m2[1]);}catch(e){}}
    if(!t){try{t=localStorage.getItem('staffora_token')||'';}catch(e){}}
    return t;
  }
  var tok=tokenFromUrl();
  if(tok){
    try{localStorage.setItem('staffora_token',tok);}catch(e){}
    document.getElementById('st').textContent='Login OK — öffne Dashboard…';
    location.replace(DASH+'?token='+encodeURIComponent(tok));
    return;
  }
  var login=API+'/auth/login?return='+encodeURIComponent(DASH);
  document.getElementById('btn-login').href=login;
  document.getElementById('btn-login').onclick=function(ev){ev.preventDefault();location.href=login;};
})();
</script>
</body></html>
