<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staffora — Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="scene dashboard-page">
<div class="app-shell dashboard-shell">
  <aside class="sidebar dashboard-sidebar glass">
    <a class="brand" href="/">
      <span class="brand-mark">S</span>
      <span><b>STAFFORA</b><small>CONTROL CENTER</small></span>
    </a>

    <button class="server-mini" id="serverButton">
      <span class="server-icon">S</span>
      <span class="grow"><b id="serverName">Staffora Community</b><small>1.248 Mitglieder · Online</small></span>
      <span class="server-chevron">⌄</span>
    </button>

    <div class="sidebar-search">
      <input id="globalSearch" placeholder="Kategorie suchen …">
    </div>

    <nav id="categories" class="category-nav"></nav>

    <div class="side-user">
      <span class="avatar">M</span>
      <span class="grow"><b>MaxPower</b><small>Server Admin</small></span>
      <span class="side-version">v2.2.0</span>
    </div>
  </aside>

  <section class="workspace dashboard-workspace">
    <div class="server-picker glass" id="serverPicker">
      <div class="picker-head">
        <div><span class="eyebrow">SERVER AUSWÄHLEN</span><h2>Server auswählen</h2></div>
        <button class="picker-close" onclick="document.getElementById('serverPicker').classList.remove('open')">Schließen</button>
      </div>
      <p>Wähle den Server, dessen Einstellungen du bearbeiten möchtest.</p>
      <input class="server-search" id="serverSearch" placeholder="Server suchen …">
      <div class="server-list" id="serverList"></div>
    </div>

    <main class="dashboard-main dashboard-content">
      <div class="dashboard-topline">
        <div>
          <span class="eyebrow">SERVER CONTROL</span>
          <div class="dashboard-title-row"><h1>Dashboard</h1><span class="server-context" id="serverHint">Staffora Community · Einstellungen gelten nur für diesen Server.</span></div>
        </div>
        <div class="top-status"><span class="status-dot"></span>Online</div>
      </div>

      <section class="settings-stage">
        <div class="empty-state glass hidden" id="empty"></div>
        <div class="settings-panel" id="settingsPanel"></div>
      </section>
    </main>
  </section>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-card">
    <div class="drawer-head"><div><span class="eyebrow">AUSWAHL</span><h2 id="drawerTitle">Auswählen</h2></div><button class="icon-btn" id="drawerClose">×</button></div>
    <div class="action-list" id="drawerBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/api.js?v=gate1"></script>
<script src="/gate.js?v=gate1"></script>
<script src="/dashboard.js?v=gate1"></script>
<script src="/app.js"></script>
</body>
</html>
