<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>STAFFORA BOT</title>
<style>
html,body{margin:0;background:#07070a;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(145deg,#a78bfa,#6d28d9);display:grid;place-items:center;font-size:24px}
.bar{width:260px;height:5px;background:#1a1a22;border-radius:99px;overflow:hidden;margin:16px auto 0}
.fill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width .1s}
.sub{color:#8b8b9a;font-size:14px;margin-top:8px}
.err{color:#f87171;margin-top:12px;font-size:13px;max-width:440px;margin-left:auto;margin-right:auto;word-break:break-word}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:12px;font-weight:600;text-decoration:none;margin:6px 0;min-width:220px}
.btn-p{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}
.btn-g{background:#16161a;color:#f4f4f5;border:1px solid #2a2a30}
</style></head>
<body>
<div id="boot"><div>
<div class="logo">🤖</div>
<div style="font-weight:700;font-size:18px">STAFFORA BOT</div>
<div class="sub" id="st">Lädt Dashboard…</div>
<div class="bar"><div class="fill" id="f"></div></div>
<div class="err" id="e"></div>
<div id="fallback" style="display:none;margin-top:18px">
  <a class="btn btn-p" href="https://staffora.apps.bot-hosting.cloud/auth/login?return=https%3A%2F%2Fstafforadashboard.github.io%2Fstaffora-web%2Fdashboard.html">Mit Discord anmelden</a><br/>
  <a class="btn btn-g" href="./ingame.html">Ingame Panel</a><br/>
  <a class="btn btn-g" href="./unban.html">Unban Request</a>
</div>
</div></div>
<script>
(async function(){
  try{
    var N=17, parts=[];
    function pathFor(i){
      if(i<=3) return 'staffora-upload-part1/d'+i+'.b64';
      if(i<=7) return 'staffora-upload-part2/d'+i+'.b64';
      return 'staffora-upload-part3/d'+i+'.b64';
    }
    for(var i=0;i<N;i++){
      document.getElementById('st').textContent='Lädt '+(i+1)+'/'+N;
      document.getElementById('f').style.width=Math.round((i+1)/N*100)+'%';
      var r=await fetch(pathFor(i)+'?v=loginfix2');
      if(!r.ok) throw new Error('Chunk fehlt: '+pathFor(i)+' — lade part1-3 neu hoch');
      parts.push((await r.text()).replace(/\s+/g,''));
    }
    var bin=atob(parts.join(''));
    var plain; try{plain=decodeURIComponent(escape(bin))}catch(e){
      var b=new Uint8Array(bin.length);for(var j=0;j<bin.length;j++)b[j]=bin.charCodeAt(j);
      plain=new TextDecoder('utf-8').decode(b);
    }
    try{var m=location.search.match(/[?&]token=([^&]+)/);if(m)localStorage.setItem('staffora_token',decodeURIComponent(m[1]));}catch(e){}
    document.open();document.write(plain);document.close();
  }catch(err){
    document.getElementById('st').textContent='Laden fehlgeschlagen — Direktlogin:';
    document.getElementById('e').textContent=String(err&&err.message||err);
    document.getElementById('fallback').style.display='block';
  }
})();
</script>
</body></html>
