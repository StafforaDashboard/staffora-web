<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Staffora Login</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f4f4f5;font-family:system-ui,sans-serif}
.box{max-width:400px;padding:28px;border:1px solid #25252b;border-radius:16px;background:#121215;text-align:center}
.muted{color:#a1a1aa;font-size:14px;line-height:1.5}.err{color:#fca5a5}a{color:#a78bfa}
</style></head><body>
<div class="box"><h1 style="font-size:1.2rem;margin:0 0 12px">Staffora</h1>
<p class="muted" id="msg">Anmeldung wird abgeschlossen…</p></div>
<script>
(function(){
  var API='https://staffora.apps.bot-hosting.cloud';
  var REDIR='https://stafforadashboard.github.io/staffora-web/oauth/callback.html';
  var HOME='https://stafforadashboard.github.io/staffora-web/';
  var qs=new URLSearchParams(location.search||'');
  var code=qs.get('code'), err=qs.get('error'), msg=document.getElementById('msg');
  if(err){msg.className='err';msg.textContent='Abgebrochen: '+err;return;}
  if(!code){msg.className='err';msg.innerHTML='Kein Code. <a href="'+HOME+'">Zurück</a>';return;}
  fetch(API+'/api/oauth/exchange',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({code:code,redirect_uri:REDIR})
  })
  .then(function(r){
    return r.text().then(function(t){
      var d=null;
      try{d=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){
        var m=(d&&(d.error||d.message||d.error_description))||t||('HTTP '+r.status);
        throw new Error(m);
      }
      return d;
    });
  })
  .then(function(d){
    var tok=d && (d.token || d.session || d.sessionToken);
    if(!tok){
      throw new Error('Keine Session'+(d?' (Antwort ohne token – Bot neu deployen)':' (leere Antwort)'));
    }
    try{localStorage.setItem('staffora_token',tok);}catch(e){}
    if(d.user){try{localStorage.setItem('staffora_user',JSON.stringify(d.user));}catch(e){}}
    msg.textContent='Erfolgreich – Dashboard lädt…';
    location.replace(HOME+'?v=300');
  })
  .catch(function(e){
    msg.className='err';
    msg.innerHTML='Login fehlgeschlagen: '+String(e.message||e)+'<br><br><a href="'+HOME+'">Erneut</a>';
  });
})();
</script></body></html>
