<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staffora — Staff</title>
<link rel="stylesheet" href="/styles.css">
<style>
.staff-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.staff-gate .card{width:min(420px,100%);padding:32px;border-radius:18px;text-align:center}
.staff-gate h1{margin:10px 0;font-size:24px}
.staff-gate p{color:#9aa3b8;font-size:14px;line-height:1.5}
.staff-app{display:none}.staff-app.on{display:block}
.staff-shell{display:flex;min-height:100vh}
.staff-side{width:260px;padding:18px;border-right:1px solid rgba(255,255,255,.06)}
.staff-main{flex:1;padding:24px;max-width:960px}
.staff-main h1{margin:0 0 6px}
.staff-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.staff-stats .s{padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.staff-stats strong{display:block;font-size:22px;margin-top:4px}
.staff-panel{padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.08);margin-bottom:16px;background:rgba(0,0,0,.25)}
.staff-panel h2{margin:0 0 8px;font-size:16px}
.staff-panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.staff-panel input{flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:#111;color:#fff}
.nav-s{display:block;padding:10px 12px;border-radius:10px;color:#aeb8d1;margin:4px 0;text-align:left;border:0;background:transparent;width:100%}
.nav-s.active,.nav-s:hover{background:rgba(109,48,255,.25);color:#fff}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st th,table.st td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.hidden{display:none!important}
</style>
</head>
<body class="scene">
<div class="staff-gate" id="staffGate">
  <div class="card glass">
    <div class="brand-mark" style="margin:0 auto 12px">S</div>
    <h1>Staff Center</h1>
    <p>Nur für Staffora-Administratoren.<br>Zugang wird über den Helper-Bot vergeben.</p>
    <button type="button" class="btn btn-primary" id="staffDiscordLogin" style="width:100%;margin-top:12px">Mit Discord anmelden</button>
    <p id="staffErr" style="color:#f87171;min-height:20px;margin-top:12px;font-size:13px"></p>
    <a href="/" style="color:#9aa3b8;font-size:13px">← Home</a>
  </div>
</div>

<div class="staff-app" id="staffApp">
  <div class="staff-shell">
    <aside class="staff-side glass" style="margin:12px;border-radius:16px">
      <a class="brand" href="/" style="margin-bottom:16px;display:flex"><span class="brand-mark">S</span><span><b>STAFFORA</b><small>STAFF</small></span></a>
      <button type="button" class="nav-s active" data-tab="overview">Overview</button>
      <button type="button" class="nav-s" data-tab="servers">Servers</button>
      <button type="button" class="nav-s" data-tab="blacklist">Blacklist</button>
      <button type="button" class="nav-s" data-tab="premium">Premium</button>
      <button type="button" class="nav-s" data-tab="errors">Errors</button>
      <div style="margin-top:auto;padding-top:20px">
        <div id="staffUser" style="font-size:12px;color:#9aa3b8;margin-bottom:8px"></div>
        <button type="button" class="btn" id="staffLogout" style="width:100%">Logout</button>
      </div>
    </aside>
    <main class="staff-main">
      <div data-pane="overview">
        <h1>Overview</h1>
        <p style="color:#9aa3b8">Internes Staff-Panel</p>
        <div class="staff-stats">
          <div class="s glass"><span>Servers</span><strong id="st-servers">—</strong></div>
          <div class="s glass"><span>Blacklist</span><strong id="st-bl">—</strong></div>
          <div class="s glass"><span>Errors</span><strong id="st-err">—</strong></div>
          <div class="s glass"><span>Status</span><strong id="st-ok">—</strong></div>
        </div>
      </div>
      <div data-pane="servers" class="hidden">
        <div class="staff-panel">
          <h2>Bot Servers</h2>
          <button type="button" class="btn" id="btnSyncGuilds">Sync</button>
          <div class="table-wrap" style="margin-top:12px">
            <table class="st"><thead><tr><th>Server</th><th>ID</th><th></th></tr></thead><tbody id="guildBody"></tbody></table>
          </div>
        </div>
      </div>
      <div data-pane="blacklist" class="hidden">
        <div class="staff-panel">
          <h2>Blacklist</h2>
          <div class="row">
            <input id="blGuild" placeholder="Guild ID">
            <input id="blReason" placeholder="Reason">
            <button type="button" class="btn btn-primary" id="blAdd">Add</button>
          </div>
          <div id="blList" style="margin-top:14px"></div>
        </div>
      </div>
      <div data-pane="premium" class="hidden">
        <div class="staff-panel">
          <h2>Premium</h2>
          <div class="row">
            <input id="premUser" placeholder="Discord User ID">
            <input id="premDays" placeholder="Days" value="30" style="max-width:100px">
            <button type="button" class="btn btn-primary" id="premGrant">Grant</button>
            <button type="button" class="btn" id="premRevoke">Revoke</button>
            <button type="button" class="btn" id="premCheck">Check</button>
          </div>
          <pre id="premOut" style="margin-top:12px;font-size:12px;color:#9aa3b8"></pre>
        </div>
      </div>
      <div data-pane="errors" class="hidden">
        <div class="staff-panel">
          <h2>Errors</h2>
          <pre id="errBox" style="font-size:11px;max-height:400px;overflow:auto;color:#c4c4c7"></pre>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/api.js?v=fix3"></script>
<script src="/staff.js?v=fix3"></script>
</body>
</html>
