<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Unban-Antrag · Staffora</title>
<script>window.STAFFORA_API="https://staffora.apps.bot-hosting.cloud";</script>
<style>
:root{--bg:#0a0a0c;--card:#121218;--border:#2a2a35;--text:#f0f0f5;--muted:#9a9aad;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at top,#1a1030 0%,var(--bg) 55%);color:var(--text);display:flex;justify-content:center;padding:40px 16px}
.box{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
h1{margin:0 0 6px;font-size:1.5rem}.sub{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0c0c10;color:var(--text);font-size:1rem;margin-bottom:14px}
textarea{min-height:90px}button{width:100%;padding:12px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}.msg{padding:12px 14px;border-radius:10px;margin-bottom:16px}.msg.err{background:rgba(239,68,68,.15);color:#fecaca}.msg.ok{background:rgba(34,197,94,.12);color:#bbf7d0}.msg.info{background:rgba(139,92,246,.12);color:#ddd6fe}.hidden{display:none!important}
</style>
</head>
<body>
<div class="box">
<h1>Unban-Antrag</h1>
<p class="sub">Roblox-Namen eingeben. Bei aktiven Logs öffnen sich die Fragen.</p>
<div id="msg" class="msg info hidden"></div>
<div id="step-login">
<label>Server (Guild-ID)</label>
<input id="guild" placeholder="Discord Server ID"/>
<label>Roblox Username</label>
<input id="roblox" placeholder="z.B. SpielerName"/>
<button id="btn-check">Weiter</button>
</div>
<div id="step-form" class="hidden">
<p id="user-line" class="sub"></p>
<div id="questions"></div>
<label>Discord-ID (optional)</label>
<input id="discord-id" placeholder="optional"/>
<button id="btn-submit">Antrag senden</button>
</div>
<div id="step-done" class="hidden">
<div class="msg ok">Antrag wurde gesendet. Staff prüft ihn.</div>
</div>
</div>
<script>
(function(){
  var API=(window.STAFFORA_API||'https://staffora.apps.bot-hosting.cloud').replace(/\/$/,'');
  var qs=new URLSearchParams(location.search);
  if(qs.get('guild')) document.getElementById('guild').value=qs.get('guild');
  var state={};
  function show(el,type,text){el.className='msg '+type;el.textContent=text;el.classList.remove('hidden');}
  document.getElementById('btn-check').onclick=async function(){
    var guildId=document.getElementById('guild').value.trim();
    var user=document.getElementById('roblox').value.trim();
    if(!guildId||!user){return show(document.getElementById('msg'),'err','Guild-ID und Roblox-Name nötig');}
    this.disabled=true;
    try{
      var res=await fetch(API+'/api/public/guilds/'+guildId+'/unban/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({robloxUsername:user})});
      var data=await res.json();
      if(!res.ok) throw new Error(data.error||'Fehler');
      if(data.blocked){show(document.getElementById('msg'),'err',data.message||'Kein Ban / nicht berechtigt');return;}
      state.robloxUsername=data.robloxUsername;state.robloxUserId=data.robloxUserId;state.questions=data.questions||[];
      document.getElementById('user-line').textContent=data.robloxUsername+' (ID: '+data.robloxUserId+')';
      var qHtml='';
      state.questions.forEach(function(q){
        qHtml+='<label>'+(q.label||q.key)+(q.required?' *':'')+'</label><textarea data-key="'+q.key+'" '+(q.required?'required':'')+'></textarea>';
      });
      document.getElementById('questions').innerHTML=qHtml;
      document.getElementById('step-login').classList.add('hidden');
      document.getElementById('step-form').classList.remove('hidden');
      document.getElementById('msg').classList.add('hidden');
    }catch(e){show(document.getElementById('msg'),'err',e.message||'Fehler');}
    finally{this.disabled=false;}
  };
  document.getElementById('btn-submit').onclick=async function(){
    var answers={};var missing=false;
    document.querySelectorAll('#questions textarea').forEach(function(el){
      answers[el.getAttribute('data-key')]=el.value.trim();
      if(el.required&&!el.value.trim())missing=true;
    });
    if(missing){alert('Bitte Pflichtfelder ausfüllen');return;}
    this.disabled=true;
    try{
      var guildId=document.getElementById('guild').value.trim();
      var res=await fetch(API+'/api/public/guilds/'+guildId+'/unban/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({robloxUsername:state.robloxUsername,discordId:document.getElementById('discord-id').value.trim()||null,answers:answers})});
      var data=await res.json();
      if(!res.ok) throw new Error(data.error||'Fehler');
      document.getElementById('step-form').classList.add('hidden');
      document.getElementById('step-done').classList.remove('hidden');
    }catch(e){alert(e.message||'Fehler');}
    finally{this.disabled=false;}
  };
})();
</script>
</body>
</html>
