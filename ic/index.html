<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staffora — IC Panel</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="scene dashboard-page">
<div class="app-shell" style="display:block;padding:24px;max-width:960px;margin:0 auto">
  <a class="brand" href="/" style="margin-bottom:20px;display:inline-flex"><span class="brand-mark">S</span><span><b>STAFFORA</b><small>IC PANEL</small></span></a>
  <div class="glass" style="padding:24px;border-radius:16px">
    <h1 style="margin:0 0 8px">IC Panel</h1>
    <p style="color:#8994b2;margin:0 0 16px">Lookup, Logs, Duty — nach Unlock & Login.</p>
    <div id="icRoot"><p style="color:#8994b2">Loading…</p></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/api.js?v=fix2"></script>
<script>
(function(){
  function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
  async function start(){
    var API=window.StafforaAPI;
    API.readToken();
    var root=document.getElementById('icRoot');
    if(!API.getToken()){
      root.innerHTML='<button class="btn btn-primary" id="icLogin">Discord Login</button>';
      document.getElementById('icLogin').onclick=function(){API.login(location.href)};
      return;
    }
    try{
      var me=await API.me();
      root.innerHTML='<p>Logged in as <b>'+ (me.username||me.id) +'</b></p><p style="color:#8994b2">Open Dashboard for full settings. IC tools load per server after selection in Dashboard.</p><a class="btn btn-primary" href="/dashboard/">Dashboard</a>';
    }catch(e){
      toast('Error');
      root.innerHTML='<button class="btn btn-primary" id="icLogin2">Discord Login</button>';
      document.getElementById('icLogin2').onclick=function(){API.login(location.href)};
    }
  }
  document.addEventListener('DOMContentLoaded',function(){
    if(window.StafforaGate) window.start();
    else start();
  });
})();
</script>
</body>
</html>
