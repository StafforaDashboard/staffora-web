<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>Staffora</title>
<style>body{margin:0;background:#0b0b0d;color:#a1a1aa;font-family:system-ui;display:grid;place-items:center;min-height:100vh}</style>
</head><body><p id="s">Lädt Dashboard…</p>
<script>
(async function(){
  var s=document.getElementById('s');
  try{
    var a=await fetch('./dash_part_a.txt').then(r=>r.text());
    s.textContent='Teil 2…';
    var b=await fetch('./dash_part_b.txt').then(r=>r.text());
    document.open();document.write(a+b);document.close();
  }catch(e){s.textContent='Fehler: '+e.message+'. Nutze die Live-Version über die Startseite.';}
})();
</script></body></html>
