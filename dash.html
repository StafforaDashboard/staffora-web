<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>Staffora</title>
<style>body{margin:0;background:#0b0b0d;color:#a1a1aa;font-family:system-ui;display:grid;place-items:center;min-height:100vh}</style>
</head><body><p id="s">Lädt…</p>
<script>
(async function(){
  var files=["dpart0.txt","dpart1.txt","dpart2.txt","dpart3.txt","dpart4.txt","dpart5.txt","dpart6.txt","dpart7.txt"];
  var s=document.getElementById('s'), html='';
  try{
    for(var i=0;i<files.length;i++){
      s.textContent='Teil '+(i+1)+'/'+files.length;
      var r=await fetch('./'+files[i]);
      if(!r.ok) throw new Error(files[i]+' '+r.status);
      html+=await r.text();
    }
    document.open();document.write(html);document.close();
  }catch(e){s.textContent='Fehler: '+e.message+' — nutze die Startseite für die Live-Version.';}
})();
</script></body></html>
