<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"/><title>Ingame</title>
<style>body{margin:0;background:#06060a;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}</style></head><body>
<div id="s">Lädt Ingame…</div>
<script>
(async function(){
  var parts=[];
  for (var p of ['xa0','xa1','xa2','xb0','xb1','xb2']) {
    var r=await fetch(p+'.txt?v=5');
    if(!r.ok) throw new Error('fehlt '+p);
    parts.push(await r.text());
  }
  var html=parts.join('');
  try{var m=location.search.match(/[?&]token=([^&]+)/);if(m)localStorage.setItem('staffora_token',decodeURIComponent(m[1]));}catch(e){}
  var d=new DOMParser().parseFromString(html,'text/html');
  document.replaceChild(document.importNode(d.documentElement,true),document.documentElement);
  document.querySelectorAll('script').forEach(function(old){var s=document.createElement('script');if(old.src)s.src=old.src;else s.textContent=old.textContent;old.parentNode.replaceChild(s,old);});
})().catch(function(e){document.getElementById('s').textContent=e.message;});
</script></body></html>
