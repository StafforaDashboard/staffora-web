<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ingame Panel</title>
<style>
html,body{margin:0;background:#0b0b0d;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(145deg,#8b5cf6,#4c1d95);display:grid;place-items:center;font-weight:800;box-shadow:0 12px 36px rgba(124,58,237,.35)}
.bar{width:260px;height:5px;background:#1a1a1f;border-radius:99px;overflow:hidden;margin:16px auto 0}
.fill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#a78bfa);transition:width .12s}
.sub{color:#94a3b8;font-size:14px;margin-top:8px}.err{color:#fca5a5;margin-top:12px;font-size:13px}
</style></head>
<body>
<div id="boot"><div>
<div class="logo">S</div>
<div style="font-weight:700;font-size:20px">Ingame Panel</div>
<div class="sub" id="st">Lädt vollständige Seite…</div>
<div class="bar"><div class="fill" id="f"></div></div>
<div class="err" id="e"></div>
</div></div>
<script>
(async function(){
  var N=6, parts=[];
  for(var i=0;i<N;i++){
    document.getElementById('st').textContent='Lädt '+(i+1)+'/'+N;
    document.getElementById('f').style.width=Math.round((i+1)/N*100)+'%';
    var r=await fetch('g'+i+'.b64?v=full20260902');
    if(!r.ok) throw new Error('Teil fehlt: g'+i+'.b64');
    parts.push((await r.text()).replace(/\s+/g,''));
  }
  var plain=decodeURIComponent(escape(atob(parts.join(''))));
  try{var m=location.search.match(/[?&]token=([^&]+)/);if(m)localStorage.setItem('staffora_token',decodeURIComponent(m[1]));}catch(e){}
  var doc=new DOMParser().parseFromString(plain,'text/html');
  document.replaceChild(document.importNode(doc.documentElement,true),document.documentElement);
  document.querySelectorAll('script').forEach(function(old){
    var s=document.createElement('script');
    if(old.src) s.src=old.src; else s.textContent=old.textContent;
    old.parentNode.replaceChild(s,old);
  });
})().catch(function(err){
  document.getElementById('st').textContent='Fehler';
  document.getElementById('e').textContent=String(err&&err.message||err);
});
</script>
</body></html>
