<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ingame Panel · Staffora</title>
<style>
html,body{margin:0;background:#07070a;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(145deg,#a78bfa,#5b21b6);display:grid;place-items:center;font-weight:800;box-shadow:0 12px 36px rgba(139,92,246,.35)}
.sub{color:#9ca3af;font-size:14px;margin-top:8px}.err{color:#fca5a5;margin-top:12px;font-size:14px}
.bar{width:240px;height:5px;background:#1a1a1f;border-radius:99px;overflow:hidden;margin:16px auto 0}
.fill{height:100%;width:0;background:#8b5cf6;transition:width .15s}
</style></head>
<body>
<div id="boot"><div>
<div class="logo">S</div>
<div style="font-weight:700;font-size:20px">Ingame Panel</div>
<div class="sub" id="st">Lädt…</div>
<div class="bar"><div class="fill" id="f"></div></div>
<div class="err" id="e"></div>
</div></div>
<script>
(async function(){
  var parts=[];
  for(var i=0;i<2;i++){
    document.getElementById('st').textContent='Teil '+(i+1)+'/2';
    document.getElementById('f').style.width=Math.round((i+1)/2*100)+'%';
    var r=await fetch('ingame-c'+i+'.txt?v=1');
    if(!r.ok) throw new Error('Teil fehlt: '+i);
    parts.push((await r.text()).replace(/\s+/g,''));
  }
  var bin=atob(parts.join(''));
  var bytes=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++) bytes[j]=bin.charCodeAt(j);
  var ds=new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
  var plain=await new Response(ds).text();
  try{
    var m=location.search.match(/[?&]token=([^&]+)/);
    if(m) localStorage.setItem('staffora_token',decodeURIComponent(m[1]));
  }catch(e){}
  var doc=new DOMParser().parseFromString(plain,'text/html');
  document.replaceChild(document.importNode(doc.documentElement,true),document.documentElement);
  document.querySelectorAll('script').forEach(function(old){
    var s=document.createElement('script');
    if(old.src)s.src=old.src; else s.textContent=old.textContent;
    old.parentNode.replaceChild(s,old);
  });
})().catch(function(err){
  document.getElementById('st').textContent='Fehler';
  document.getElementById('e').textContent=String(err&&err.message||err);
});
</script>
</body></html>
