<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staffora — Dashboard</title>
<link rel="stylesheet" href="/assets/styles.css?v=3d2">
<link rel="stylesheet" href="/assets/dash.css?v=3d3">
<script>
window.STAFFORA_API = window.STAFFORA_API || "https://staffora.apps.bot-hosting.cloud";
window.STAFFORA_RETURN = location.origin + "/dashboard/";
</script>
</head>
<body class="dash-body">
<canvas id="bg"></canvas>

<!-- Login -->
<div id="gate" class="gate">
  <div class="gate-box glass">
    <div class="eyebrow" style="margin-bottom:8px">Staffora</div>
    <h1 style="margin:0 0 10px;font:700 1.6rem Space Grotesk,sans-serif">Dashboard Login</h1>
    <p style="color:#9298a8;line-height:1.5;margin:0 0 18px">Mit Discord anmelden, danach Server und Kategorie wählen.</p>
    <button type="button" class="btn btn-p" id="btn-login" style="width:100%;justify-content:center">Mit Discord anmelden</button>
    <p id="login-err" style="color:#fb7185;font-size:12px;margin-top:12px"></p>
  </div>
</div>

<!-- Server picker -->
<div id="picker" class="picker hidden">
  <div class="picker-box glass">
    <div class="eyebrow" style="margin-bottom:8px">Schritt 1 von 3</div>
    <h1 style="margin:0 0 8px;font:700 1.5rem Space Grotesk,sans-serif">Server wählen</h1>
    <p style="color:#9298a8;font-size:13px;margin:0 0 10px">Zuerst Server — danach Kategorie — erst dann Settings.</p>
    <input type="search" id="srv-search" placeholder="Server suchen…" style="width:100%;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#0e1016;color:#fff">
    <div class="picker-list" id="srv-list"></div>
  </div>
</div>

<div id="app" class="dash-shell hidden">
  <aside class="dash-side">
    <a class="dash-brand" href="/"><i>S</i> Staffora</a>
    <div class="srv-card" id="srv-card" title="Server wechseln">
      <small>Server</small>
      <b id="srv-name">—</b>
    </div>
    <nav class="side-nav" id="side-nav">
      <button type="button" data-view="hub" class="on">◈ Übersicht</button>
    </nav>
    <div style="margin-top:auto;padding-top:20px">
      <a class="btn" href="/ic/" style="width:100%;justify-content:center;margin-bottom:8px">IC Panel</a>
      <a class="btn" href="/appeal/" style="width:100%;justify-content:center">Ban Appeal</a>
    </div>
  </aside>
  <main class="dash-main">
    <div class="topbar">
      <div>
        <div class="eyebrow" id="top-eye">Server Control</div>
        <h1 id="top-title">Dashboard</h1>
      </div>
      <div class="user-pill"><span id="user-name">User</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="toast"></div>
<script src="/assets/dash-app.js?v=3d3"></script>
</body>
</html>
