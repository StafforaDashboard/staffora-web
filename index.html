<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora Dashboard</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
.box{text-align:center;padding:32px;max-width:440px}
h1{margin:0 0 8px;font-size:1.75rem}
p{color:#9ca3af;line-height:1.5;margin:0 0 12px}
a{display:inline-block;margin:6px;padding:12px 18px;border-radius:10px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:600}
a.sec{background:#1a1a1f;border:1px solid #2a2a30}
code{font-size:12px;color:#c4b5fd}
</style>
</head><body>
<div class="box">
  <h1>Staffora</h1>
  <p>Dashboard · Ingame · Schicht · Warns · Unban</p>
  <p id="m">Weiterleitung zum Live-Dashboard…</p>
  <a id="go" href="https://staffora.apps.bot-hosting.cloud/dashboard">Dashboard öffnen</a>
  <a class="sec" href="./unban.html">Unban-Antrag</a>
  <p style="margin-top:18px"><code id="api">API: staffora.apps.bot-hosting.cloud</code></p>
</div>
<script>
(function(){
  var API=(localStorage.getItem("staffora_api")||"https://staffora.apps.bot-hosting.cloud").replace(/\/$/,"");
  var q=(location.search.match(/[?&]api=([^&]+)/)||[])[1];
  if(q){try{API=decodeURIComponent(q).replace(/\/$/,"");localStorage.setItem("staffora_api",API);}catch(e){}}
  var url=API+"/dashboard"+(location.hash||"");
  document.getElementById("go").href=url;
  document.getElementById("api").textContent="API: "+API.replace(/^https?:\/\//,"");
  document.getElementById("m").textContent="Öffne Live-Dashboard (Ingame & Settings)…";
  setTimeout(function(){ location.replace(url); }, 500);
})();
</script>
</body></html>
