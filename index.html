<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>html,body,iframe{margin:0;height:100%;width:100%;border:0;background:#08080a}</style>
</head>
<body>
<iframe id="f" title="Staffora" allow="clipboard-write"></iframe>
<script>
(function(){
  var cloud="https://staffora.apps.bot-hosting.cloud";
  var qs=new URLSearchParams(location.search||"");
  var t=qs.get("token");
  if(t){try{localStorage.setItem("staffora_token",t)}catch(e){}
    qs.delete("token");history.replaceState({},"",location.pathname+(qs.toString()?"?"+qs:""));}
  var tok=localStorage.getItem("staffora_token")||t||"";
  if(!tok){
    location.replace(cloud+"/auth/login?return="+encodeURIComponent(location.href.split("?")[0].split("#")[0]));
    return;
  }
  document.getElementById("f").src=cloud+"/dashboard?token="+encodeURIComponent(tok);
})();
</script>
</body>
</html>
