<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
.box{text-align:center;padding:24px}.bar{width:260px;height:6px;background:#222;border-radius:99px;overflow:hidden;margin:16px auto 0}
.fill{height:100%;width:0;background:#7c3aed;transition:width .15s}
.err{color:#fca5a5;margin-top:12px;font-size:14px}
</style></head><body>
<div class="box">
<div style="font-weight:700;font-size:20px">Staffora</div>
<div id="st" style="color:#9ca3af;margin-top:8px">Lade Dashboard…</div>
<div class="bar"><div class="fill" id="f"></div></div>
<div class="err" id="e"></div>
</div>
<script>
(async function(){
  var N=11;
  var parts=[];
  for(var i=0;i<N;i++){
    var name='c'+String(i).padStart(2,'0')+'.txt';
    document.getElementById('st').textContent='Teil '+(i+1)+'/'+N;
    document.getElementById('f').style.width=Math.round((i+1)/N*100)+'%';
    var r=await fetch(name+'?v=20260901b');
    if(!r.ok) throw new Error('Datei fehlt: '+name+' ('+r.status+')');
    parts.push((await r.text()).replace(/\s+/g,''));
  }
  var bin=atob(parts.join(''));
  var bytes=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++) bytes[j]=bin.charCodeAt(j);
  if(!window.DecompressionStream) throw new Error('Browser zu alt (kein gzip)');
  var ds=new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
  var plain=await new Response(ds).text();
  try{
    var m=location.search.match(/[?&]token=([^&]+)/);
    if(m) localStorage.setItem('staffora_token', decodeURIComponent(m[1]));
  }catch(e){}
  document.open(); document.write(plain); document.close();
})().catch(function(err){
  document.getElementById('st').textContent='Fehler';
  document.getElementById('e').textContent=String(err && err.message || err);
});
</script>
</body></html>
