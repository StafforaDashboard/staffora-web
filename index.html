<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora Dashboard</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
.box{text-align:center;padding:24px}.bar{width:240px;height:6px;background:#222;border-radius:99px;overflow:hidden;margin:16px auto}
.fill{height:100%;width:0%;background:#7c3aed;transition:width .2s}
</style></head><body>
<div class="box"><div style="font-weight:700;font-size:20px">Staffora</div>
<div class="muted" id="st">Lade Dashboard…</div>
<div class="bar"><div class="fill" id="f"></div></div></div>
<script>
(async function(){
  var N=8;
  var parts=[];
  for(var i=0;i<N;i++){
    var name='n'+String(i).padStart(2,'0')+'.b64';
    document.getElementById('st').textContent='Teil '+(i+1)+'/'+N;
    document.getElementById('f').style.width=((i+1)/N*100)+'%';
    var r=await fetch(name+'?v=20260901');
    if(!r.ok) throw new Error('missing '+name);
    parts.push(await r.text());
  }
  var b64=parts.join('').replace(/\s+/g,'');
  var bin=atob(b64);
  var bytes=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++) bytes[j]=bin.charCodeAt(j);
  var plain;
  if(window.DecompressionStream){
    var ds=new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
    plain=await new Response(ds).text();
  } else {
    throw new Error('Browser braucht DecompressionStream');
  }
  document.open(); document.write(plain); document.close();
})().catch(function(e){
  document.getElementById('st').textContent='Fehler: '+e.message;
});
</script></body></html>
