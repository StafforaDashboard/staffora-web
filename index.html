<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>body{margin:0;min-height:100vh;background:#08080a;color:#a1a1aa;font-family:system-ui;display:flex;align-items:center;justify-content:center}</style>
</head>
<body><p id="st">Staffora wird geladen…</p>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
(function(){
  var n=113, v='?v=301';
  function fail(e){
    var el=document.getElementById('st');
    el.style.color='#fca5a5';
    el.textContent='Fehler: '+(e&&e.message?e.message:e);
  }
  function inflate(bytes){
    if(window.fflate && fflate.gunzipSync){
      return Promise.resolve(fflate.gunzipSync(bytes));
    }
    return new Response(bytes).arrayBuffer().then(function(buf){
      return new Response(buf).body.pipeThrough(new DecompressionStream('gzip')).arrayBuffer()
        .then(function(ab){ return new Uint8Array(ab); });
    });
  }
  Promise.all(Array.from({length:n},function(_,i){
    return fetch('k'+i+'.txt'+v).then(function(r){
      if(!r.ok) throw new Error('Teil k'+i+' fehlt ('+r.status+')');
      return r.text();
    });
  })).then(function(parts){
    var bin = atob(parts.join(''));
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return inflate(bytes);
  }).then(function(bytes){
    var html = new TextDecoder().decode(bytes);
    document.open(); document.write(html); document.close();
  }).catch(fail);
})();
</script>
</body></html>
