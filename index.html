<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title></head><body style="background:#08080a;color:#a1a1aa;font-family:system-ui;padding:24px">
<p id="st">Staffora Dashboard wird geladen…</p>
<script>
(function(){
  var n=12;
  Promise.all(Array.from({length:n},function(_,i){
    return fetch('ih'+i+'.txt?v=23').then(function(r){
      if(!r.ok) throw new Error('ih'+i+' '+r.status);
      return r.text();
    });
  })).then(function(parts){
    var html = decodeURIComponent(escape(atob(parts.join('').trim())));
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    document.getElementById('st').textContent='Fehler: '+e.message;
  });
})();
</script>
</body></html>
