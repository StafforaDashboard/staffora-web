<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Staffora</title>
<style>
body{margin:0;min-height:100vh;background:#08080a;color:#a1a1aa;font-family:system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#st{max-width:420px;line-height:1.5}
.err{color:#fca5a5}
</style>
</head>
<body>
<p id="st">Staffora wird geladen…</p>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
<script>
/* stable-d-loader-v260-split */
(function(){
  var st=document.getElementById('st');
  var n=19;
  function fail(m){ st.className='err'; st.textContent='Fehler: '+m; }
  function inflateBytes(bytes){
    if(typeof fflate!=='undefined' && fflate.gunzipSync){
      return Promise.resolve(fflate.gunzipSync(bytes));
    }
    if(typeof DecompressionStream!=='undefined'){
      return new Response(bytes).arrayBuffer().then(function(buf){
        var stream=new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
      });
    }
    return Promise.reject(new Error('Kein Gzip-Support'));
  }
  function fetchPart(name){
    return fetch(name+'?v=260').then(function(r){
      if(!r.ok) throw new Error(name+' '+r.status);
      return r.text();
    });
  }
  // d0 and d1 are split into a/b halves to avoid upload corruption
  Promise.all([
    Promise.all([fetchPart('d0a.txt'), fetchPart('d0b.txt')]).then(function(p){ return p.join(''); }),
    Promise.all([fetchPart('d1a.txt'), fetchPart('d1b.txt')]).then(function(p){ return p.join(''); }),
    Promise.all(Array.from({length:n-2},function(_,i){
      return fetchPart('d'+(i+2)+'.txt');
    }))
  ]).then(function(groups){
    var parts = [groups[0], groups[1]].concat(groups[2]);
    var bin=atob(parts.join(''));
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return inflateBytes(bytes);
  }).then(function(inflated){
    var html=new TextDecoder().decode(inflated);
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    fail(e && e.message ? e.message : String(e));
  });
})();
</script>
</body></html>
