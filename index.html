<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title></head>
<body style="margin:0;min-height:100vh;background:#08080a;color:#a1a1aa;font-family:system-ui;display:flex;align-items:center;justify-content:center">
<p id="st">Staffora wird geladen…</p>
<script>
(function(){
  var n=2;
  Promise.all(Array.from({length:n},function(_,i){
    return fetch('p'+i+'.txt?v=40').then(function(r){
      if(!r.ok) throw new Error('p'+i+' '+r.status);
      return r.text();
    });
  })).then(function(parts){
    var bin = atob(parts.join(''));
    var html = decodeURIComponent(Array.prototype.map.call(bin, function(c){
      return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    document.open(); document.write(html); document.close();
  }).catch(function(e){
    document.getElementById('st').textContent = 'Fehler: '+e.message;
  });
})();
</script>
</body></html>
