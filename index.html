<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Staffora</title>
<style>body{margin:0;min-height:100vh;background:#08080a;color:#a1a1aa;font-family:system-ui;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#st{max-width:420px}.err{color:#fca5a5}</style></head>
<body><p id="st">Staffora wird geladen…</p>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
<script>
(function(){
  var st=document.getElementById('st'), n=8;
  function fail(m){st.className='err';st.textContent='Fehler: '+m;}
  function inflate(bytes){
    if(typeof fflate!=='undefined'&&fflate.gunzipSync) return Promise.resolve(fflate.gunzipSync(bytes));
    if(typeof DecompressionStream!=='undefined'){
      return new Response(bytes).arrayBuffer().then(function(buf){
        var s=new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(s).arrayBuffer().then(function(ab){return new Uint8Array(ab);});
      });
    }
    return Promise.reject(new Error('Kein Gzip-Support'));
  }
  Promise.all(Array.from({length:n},function(_,i){
    return fetch('g'+i+'.txt?v=70').then(function(r){if(!r.ok)throw new Error('g'+i+' '+r.status);return r.text();});
  })).then(function(parts){
    var bin=atob(parts.join(''));
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return inflate(bytes);
  }).then(function(inflated){
    var html=new TextDecoder().decode(inflated);
    document.open();document.write(html);document.close();
  }).catch(function(e){fail(e&&e.message?e.message:String(e));});
})();
</script></body></html>
