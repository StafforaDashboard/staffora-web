<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
:root{--bg:#0b0b0d;--card:#16161a;--border:#2a2a30;--text:#f4f4f5;--muted:#9ca3af;--accent:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
background-image:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.12),transparent 55%)}
.wrap{max-width:960px;margin:0 auto;padding:48px 20px 80px;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:linear-gradient(145deg,#8b5cf6,#4c1d95);display:grid;place-items:center;font-weight:800;font-size:24px;box-shadow:0 16px 40px rgba(124,58,237,.35)}
h1{font-size:2.1rem;margin-bottom:8px}.sub{color:var(--muted);margin-bottom:24px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:36px}
.btn{display:inline-flex;padding:12px 20px;border-radius:12px;font-weight:600;text-decoration:none}
.btn-p{background:var(--accent);color:#fff}.btn-g{background:var(--card);color:var(--text);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;text-align:left}
.card{background:rgba(22,22,26,.95);border:1px solid var(--border);border-radius:16px;padding:22px}
.card h2{font-size:1.05rem;margin:8px 0}.card p{color:var(--muted);font-size:14px;margin-bottom:10px}
.card a{color:#c4b5fd;font-weight:600;font-size:14px}
</style></head>
<body>
<div class="wrap">
<div class="logo">S</div>
<h1>Staffora</h1>
<p class="sub">Team · Ingame · Unban</p>
<div class="actions">
<a class="btn btn-p" href="./dashboard.html">Staff Dashboard</a>
<a class="btn btn-g" href="./ingame.html">Ingame Panel</a>
<a class="btn btn-g" href="./unban.html">Unban-Antrag</a>
</div>
<div class="grid">
<div class="card"><h2>Staff Dashboard</h2><p>Module, Rollen, Tickets.</p><a href="./dashboard.html">Öffnen →</a></div>
<div class="card"><h2>Ingame Panel</h2><p>Bans, Warns, Links.</p><a href="./ingame.html">Öffnen →</a></div>
<div class="card"><h2>Unban</h2><p>Roblox-Login & Antrag.</p><a href="./unban.html">Öffnen →</a></div>
</div>
</div>
</body></html>
