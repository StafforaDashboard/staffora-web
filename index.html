<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
body{margin:0;min-height:100vh;background:#08080a;color:#a1a1aa;font-family:system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#st{max-width:420px;line-height:1.5}
.err{color:#fca5a5}
</style>
</head>
<body>
<p id="st">Staffora wird geladen…</p>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
<script>
(function(){
  var st=document.getElementById('st');
  var n=19;
  function fail(m){
    st.className='err';
    st.textContent='Fehler: '+m;
  }
  Promise.all(Array.from({length:n},function(_,i){
    return fetch('d'+i+'.txt?v=42').then(function(r){
      if(!r.ok) throw new Error('d'+i+' '+r.status);
      return r.text();
    });
  })).then(function(parts){
    var bin=atob(parts.join(''));
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(typeof fflate==='undefined' || !fflate.gunzipSync){
      throw new Error('fflate nicht geladen');
    }
    var inflated=fflate.gunzipSync(bytes);
    var html=new TextDecoder().decode(inflated);
    document.open();
    document.write(html);
    document.close();
  }).catch(function(e){
    fail(e && e.message ? e.message : String(e));
  });
})();
</script>
</body></html>
