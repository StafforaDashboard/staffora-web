<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
html,body{margin:0;background:#08080a;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;background:linear-gradient(145deg,#8b5cf6,#4c1d95);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 12px 40px rgba(124,58,237,.35)}
.sub{color:#9ca3af;font-size:14px;margin-top:8px}
.err{color:#fca5a5;margin-top:14px;font-size:14px;max-width:420px}
.btn{display:inline-flex;margin-top:16px;padding:12px 20px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:600}
</style></head>
<body>
<div id="boot">
  <div>
    <div class="logo">S</div>
    <div style="font-weight:700;font-size:22px">Staffora</div>
    <div class="sub" id="st">Dashboard wird geladen…</div>
    <div class="err" id="e"></div>
  </div>
</div>
<script>
(async function () {
  var API = 'https://staffora.apps.bot-hosting.cloud';
  try {
    var m = location.search.match(/[?&]token=([^&]+)/);
    if (m) localStorage.setItem('staffora_token', decodeURIComponent(m[1]));
    if (location.hash && location.hash.indexOf('token=') >= 0) {
      var hm = location.hash.match(/token=([^&]+)/);
      if (hm) localStorage.setItem('staffora_token', decodeURIComponent(hm[1]));
    }
  } catch (e) {}
  try {
    var r = await fetch(API + '/api/dashboard.html?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Bot offline oder Dashboard fehlt (' + r.status + '). Bot neu starten / zip hochladen.');
    var plain = await r.text();
    if (plain.indexOf('<html') < 0 && plain.indexOf('<!DOCTYPE') < 0) {
      throw new Error('Unerwartete Antwort vom Bot');
    }
    var doc = new DOMParser().parseFromString(plain, 'text/html');
    document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
    document.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      if (old.src) s.src = old.src;
      else s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  } catch (err) {
    document.getElementById('st').textContent = 'Konnte Dashboard nicht laden';
    document.getElementById('e').innerHTML = String(err && err.message || err) +
      '<br/><br/>Prüfe: Bot läuft? <code>/api/dashboard.html</code> erreichbar?' +
      '<br/><a class="btn" href="' + API + '/auth/login?return=' + encodeURIComponent(location.href.split('#')[0]) + '">Mit Discord anmelden</a>';
  }
})();
</script>
</body></html>
