<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
.box{text-align:center;padding:32px;max-width:420px}
a{display:inline-block;margin:8px 6px 0;padding:12px 18px;border-radius:10px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:600}
a.sec{background:#1a1a1f;border:1px solid #2a2a30}
p{color:#9ca3af;line-height:1.5}
</style>
</head><body>
<div class="box">
  <h1>Staffora</h1>
  <p>Ingame · Warns · Settings · Unban</p>
  <p id="m">Weiterleitung…</p>
  <a id="go" href="#">Dashboard öffnen</a>
  <a class="sec" href="./dash.html">Statische Version</a>
</div>
<script>
(function(){
  var API=(localStorage.getItem("staffora_api")||"https://staffora.apps.bot-hosting.cloud").replace(/\/$/,"");
  var q=(location.search.match(/[?&]api=([^&]+)/)||[])[1];
  if(q){try{API=decodeURIComponent(q).replace(/\/$/,"");localStorage.setItem("staffora_api",API);}catch(e){}}
  var url=API+"/dashboard"+(location.hash||"");
  document.getElementById("go").href=url;
  document.getElementById("m").textContent="API: "+API;
  setTimeout(function(){ location.replace(url); }, 400);
})();
</script>
</body></html>
