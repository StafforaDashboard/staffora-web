<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
html,body{margin:0;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center}
.bar{width:260px;height:6px;background:#222;border-radius:99px;overflow:hidden;margin:16px auto 0}
.fill{height:100%;width:0;background:#7c3aed;transition:width .15s}
.err{color:#fca5a5;margin-top:12px;font-size:14px}
</style></head>
<body>
<div id="boot">
  <div>
    <div style="font-weight:700;font-size:20px">Staffora</div>
    <div id="st" style="color:#9ca3af;margin-top:8px">Lade Dashboard…</div>
    <div class="bar"><div class="fill" id="f"></div></div>
    <div class="err" id="e"></div>
  </div>
</div>
<script>
(async function(){
  var N = 11;
  var parts = [];
  for (var i = 0; i < N; i++) {
    var name = 'c' + String(i).padStart(2, '0') + '.txt';
    document.getElementById('st').textContent = 'Teil ' + (i + 1) + '/' + N;
    document.getElementById('f').style.width = Math.round((i + 1) / N * 100) + '%';
    var r = await fetch(name + '?v=20260901d');
    if (!r.ok) throw new Error('Datei fehlt: ' + name + ' (' + r.status + ')');
    parts.push((await r.text()).replace(/\s+/g, ''));
  }
  var bin = atob(parts.join(''));
  var bytes = new Uint8Array(bin.length);
  for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
  if (!window.DecompressionStream) throw new Error('Browser zu alt');
  var ds = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
  var plain = await new Response(ds).text();
  try {
    var m = location.search.match(/[?&]token=([^&]+)/);
    if (m) localStorage.setItem('staffora_token', decodeURIComponent(m[1]));
  } catch (e) {}
  var doc = new DOMParser().parseFromString(plain, 'text/html');
  document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
  var scripts = document.querySelectorAll('script');
  scripts.forEach(function (old) {
    var s = document.createElement('script');
    if (old.src) s.src = old.src;
    else s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
})().catch(function (err) {
  document.getElementById('st').textContent = 'Fehler';
  document.getElementById('e').textContent = String(err && err.message || err);
});
</script>
</body></html>
