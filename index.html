<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#09090b;color:#fafafa;text-align:center;padding:24px}
.box{max-width:420px}
h1{font-size:2rem;margin:0 0 8px}
p{color:#a1a1aa;line-height:1.5}
.btn{display:inline-block;margin:8px;padding:14px 22px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;text-decoration:none;font-weight:600}
.btn2{background:#18181b;border:1px solid #27272a}
</style>
</head>
<body>
<div class="box">
  <h1>Staffora</h1>
  <p>Dienstnummern · Team · Roblox Staff</p>
  <a class="btn" id="login" href="https://staffora.apps.bot-hosting.cloud/auth/login?return=https%3A%2F%2Fstafforadashboard.github.io%2Fstaffora-web%2F">Mit Discord anmelden</a>
  <a class="btn btn2" id="invite" href="https://discord.com/oauth2/authorize?client_id=1537409443719811112&permissions=8&scope=bot%20applications.commands" target="_blank" rel="noopener">Bot einladen</a>
  <p style="font-size:12px;margin-top:24px">Nach Login wirst du zurückgeleitet.</p>
</div>
<script>
(function(){
  var API="https://staffora.apps.bot-hosting.cloud";
  var q=new URLSearchParams(location.search);
  var t=q.get("token")||"";
  if(!t){var m=(location.hash||"").match(/token=([A-Fa-f0-9]+)/);if(m)t=m[1];}
  if(t){
    try{localStorage.setItem("staffora_token",t);}catch(e){}
    location.replace(API+"/dashboard?token="+encodeURIComponent(t));
    return;
  }
  document.getElementById("login").href=API+"/auth/login?return="+encodeURIComponent(location.href.split("#")[0]);
  fetch(API+"/api/invite").then(function(r){return r.json()}).then(function(d){
    if(d&&d.url)document.getElementById("invite").href=d.url;
  }).catch(function(){});
})();
</script>
</body>
</html>
