<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Staffora</title>
<style>
html,body{margin:0;background:#08080a;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
#boot{display:grid;place-items:center;min-height:100vh;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;background:linear-gradient(145deg,#8b5cf6,#4c1d95);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 12px 40px rgba(124,58,237,.35)}
.bar{width:280px;height:6px;background:#1a1a1f;border-radius:99px;overflow:hidden;margin:18px auto 0}
.fill{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .2s}
.err{color:#fca5a5;margin-top:14px;font-size:14px;max-width:360px}
.sub{color:#9ca3af;font-size:14px}
</style></head>
<body>
<div id="boot">
  <div>
    <div class="logo">S</div>
    <div style="font-weight:700;font-size:22px;letter-spacing:-.02em">Staffora</div>
    <div class="sub" id="st" style="margin-top:8px">Dashboard wird geladen…</div>
    <div class="bar"><div class="fill" id="f"></div></div>
    <div class="err" id="e"></div>
  </div>
</div>
<script>
(async function(){
  var N = 12;
  var parts = [];
  for (var i = 0; i < N; i++) {
    var name = 'c' + String(i).padStart(2, '0') + '.txt';
    document.getElementById('st').textContent = 'Teil ' + (i + 1) + '/' + N;
    document.getElementById('f').style.width = Math.round((i + 1) / N * 100) + '%';
    var r = await fetch(name + '?v=20260901m');
    if (!r.ok) throw new Error('Datei fehlt: ' + name + ' (' + r.status + ')');
    parts.push((await r.text()).replace(/\s+/g, ''));
  }
  var bin = atob(parts.join(''));
  var bytes = new Uint8Array(bin.length);
  for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
  if (!window.DecompressionStream) throw new Error('Browser zu alt (kein gzip)');
  var ds = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
  var plain = await new Response(ds).text();
  try {
    var m = location.search.match(/[?&]token=([^&]+)/);
    if (m) localStorage.setItem('staffora_token', decodeURIComponent(m[1]));
    if (location.hash && location.hash.indexOf('token=') >= 0) {
      var h = location.hash.replace(/^#/, '');
      var hm = h.match(/token=([^&]+)/);
      if (hm) localStorage.setItem('staffora_token', decodeURIComponent(hm[1]));
    }
  } catch (e) {}
  var doc = new DOMParser().parseFromString(plain, 'text/html');
  document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
  document.querySelectorAll('script').forEach(function (old) {
    var s = document.createElement('script');
    if (old.src) s.src = old.src;
    else s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
})().catch(function (err) {
  document.getElementById('st').textContent = 'Fehler beim Laden';
  document.getElementById('e').textContent = String(err && err.message || err);
});
</script>
</body></html>
